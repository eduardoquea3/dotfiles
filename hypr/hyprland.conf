###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = thunar
$menu = rofi -show drun
$scripts = $HOME/.config/hypr/scripts
# $menu = wofi --show run

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow



# Load monitors from separate file
source = ~/.config/hypr/hyprland/monitors.conf
# Load env from separate file
source = ~/.config/hypr/hyprland/env.conf
# Load design from separate file
source = ~/.config/hypr/hyprland/design.conf
# Load input from separate file
source = ~/.config/hypr/hyprland/input.conf
# Load init from separate file
source = ~/.config/hypr/hyprland/init.conf
# Load keybinds from separate file
source = ~/.config/hypr/hyprland/keybinds.conf
# Load windowrules from separate file
source = ~/.config/hypr/hyprland/windowrules.conf
